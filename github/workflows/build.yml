          package com.flycast.emulator.dashboard;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.SoundPool;
          import android.os.Build;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.OutputStream;

          /**
           * Background music (looping) and short UI sounds for the dashboard.
           * If the user did not choose a click sound, two short original tones are generated in code.
           */
          public class SoundManager {
              private final Context context;
              private final DashboardStore store;

              private SoundPool pool;
              private int moveSound;
              private int selectSound;
              private boolean customClick;
              private boolean soundsLoaded;

              private MediaPlayer music;
              private String musicPath;
              private boolean started;

              public SoundManager(Context context, DashboardStore store) {
                  this.context = context.getApplicationContext();
                  this.store = store;
              }

              // ---- UI sounds ----

              public void reloadClickSounds() {
                  releasePool();
                  soundsLoaded = false;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      AudioAttributes attrs = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_GAME)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build();
                      pool = new SoundPool.Builder().setMaxStreams(4).setAudioAttributes(attrs).build();
                  } else {
                      pool = new SoundPool(4, AudioManager.STREAM_MUSIC, 0);
                  }
                  String custom = store.getClickPath();
                  try {
                      if (custom != null) {
                          customClick = true;
                          moveSound = pool.load(custom, 1);
                          selectSound = moveSound;
                      } else {
                          customClick = false;
                          File dir = context.getCacheDir();
                          File move = new File(dir, "dash_move.wav");
                          File select = new File(dir, "dash_select.wav");
                          writeTone(move, 1040, 45, 0.35f);
                          writeTone(select, 1480, 110, 0.5f);
                          moveSound = pool.load(move.getAbsolutePath(), 1);
                          selectSound = pool.load(select.getAbsolutePath(), 1);
                      }
                      soundsLoaded = true;
                  } catch (Exception e) {
                      soundsLoaded = false;
                  }
              }

              public void playMove() {
                  if (pool == null)
                      reloadClickSounds();
                  if (soundsLoaded && store.isSfxOn() && pool != null)
                      pool.play(moveSound, customClick ? 0.5f : 0.8f, customClick ? 0.5f : 0.8f, 1, 0, 1f);
              }

              public void playSelect() {
                  if (pool == null)
                      reloadClickSounds();
                  if (soundsLoaded && store.isSfxOn() && pool != null)
                      pool.play(selectSound, 1f, 1f, 1, 0, 1f);
              }

              private static void writeTone(File file, int freq, int millis, float amplitude) throws IOException {
                  final int rate = 22050;
                  int samples = rate * millis / 1000;
                  byte[] pcm = new byte[samples * 2];
                  for (int i = 0; i < samples; i++) {
                      double t = i / (double) rate;
                      // fast attack, exponential decay
                      double env = Math.min(1.0, i / 80.0) * Math.exp(-6.0 * i / samples);
                      short v = (short) (Math.sin(2 * Math.PI * freq * t) * env * amplitude * 32767);
                      pcm[2 * i] = (byte) (v & 0xff);
                      pcm[2 * i + 1] = (byte) ((v >> 8) & 0xff);
                  }
                  OutputStream out = new FileOutputStream(file);
                  try {
                      int dataLen = pcm.length;
                      byte[] h = new byte[44];
                      putStr(h, 0, "RIFF");
                      putInt(h, 4, 36 + dataLen);
                      putStr(h, 8, "WAVE");
                      putStr(h, 12, "fmt ");
                      putInt(h, 16, 16);
                      h[20] = 1; // PCM
                      h[22] = 1; // mono
                      putInt(h, 24, rate);
                      putInt(h, 28, rate * 2);
                      h[32] = 2; // block align
                      h[34] = 16; // bits per sample
                      putStr(h, 36, "data");
                      putInt(h, 40, dataLen);
                      out.write(h);
                      out.write(pcm);
                  } finally {
                      out.close();
                  }
              }

              private static void putStr(byte[] b, int off, String s) {
                  for (int i = 0; i < s.length(); i++)
                      b[off + i] = (byte) s.charAt(i);
              }

              private static void putInt(byte[] b, int off, int v) {
                  b[off] = (byte) (v & 0xff);
                  b[off + 1] = (byte) ((v >> 8) & 0xff);
                  b[off + 2] = (byte) ((v >> 16) & 0xff);
                  b[off + 3] = (byte) ((v >> 24) & 0xff);
              }

              // ---- background music ----

              /** Call from onResume. Starts the music if it is enabled and a file was chosen. */
              public void startMusic() {
                  started = true;
                  updateMusic();
              }

              /** Call from onPause (also when a game is launched). */
              public void pauseMusic() {
                  started = false;
                  if (music != null) {
                      try {
                          if (music.isPlaying())
                              music.pause();
                      } catch (IllegalStateException ignored) {
                      }
                  }
              }

              /** Re-evaluates the music state after the settings changed. */
              public void updateMusic() {
                  String path = store.getMusicPath();
                  boolean shouldPlay = started && store.isMusicOn() && path != null;
                  if (!shouldPlay) {
                      if (music != null) {
                          try {
                              if (music.isPlaying())
                                  music.pause();
                          } catch (IllegalStateException ignored) {
                          }
                      }
                      if (path == null)
                          releaseMusic();
                      return;
                  }
                  try {
                      if (music == null || musicPath == null || !musicPath.equals(path)) {
                          releaseMusic();
                          music = new MediaPlayer();
                          music.setDataSource(path);
                          music.setLooping(true);
                          music.prepare();
                          musicPath = path;
                      }
                      float vol = store.getVolume() / 100f;
                      music.setVolume(vol, vol);
                      if (!music.isPlaying())
                          music.start();
                  } catch (Exception e) {
                      releaseMusic();
                  }
              }

              private void releaseMusic() {
                  if (music != null) {
                      try {
                          music.release();
                      } catch (Exception ignored) {
                      }
                      music = null;
                      musicPath = null;
                  }
              }

              private void releasePool() {
                  if (pool != null) {
                      pool.release();
                      pool = null;
                  }
              }

              public void release() {
                  releaseMusic();
                  releasePool();
              }
          }
