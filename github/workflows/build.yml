                  c.drawCircle(cx, cy, r, fill);
                  fill.setShader(null);
                  fill.setColor(bright ? 0xFF2F7A0A : 0xFF3A444B);
                  c.drawCircle(cx, cy, r * 0.62f, fill);
                  fill.setColor(0xFFE8EDF0);
                  c.drawCircle(cx, cy, r * 0.30f, fill);
