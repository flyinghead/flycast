          import re, sys
          p = "shell/android-studio/flycast/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "dashboard.DashboardActivity" in s:
              sys.exit(0)
          pat = re.compile(r'(?P<alias><activity-alias\s[^>]*?android:name="com\.flycast\.emulator\.MainActivity"[^>]*>)\s*<intent-filter>\s*<action android:name="android\.intent\.action\.MAIN"\s*/>.*?</intent-filter>', re.S)
          m = pat.search(s)
          if not m:
              sys.exit("manifest pattern not found")
          act = """<activity
                      android:name="com.flycast.emulator.dashboard.DashboardActivity"
                      android:configChanges="orientation|navigation|screenSize|screenLayout|uiMode|keyboard|keyboardHidden"
                      android:screenOrientation="sensorLandscape"
                      android:exported="true"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  """
          s = s[:m.start()] + act + m.group("alias") + s[m.end():]
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")
