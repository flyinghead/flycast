          import sys
          from PIL import Image, ImageDraw, ImageFilter, ImageFont

          res = sys.argv[1]
          S = 4  # supersampling


          def orb(size):
              """Original glossy green orb with a disc in the middle."""
              n = size * S
              img = Image.new("RGBA", (n, n), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              m = int(n * 0.06)
              # soft shadow
              sh = Image.new("RGBA", (n, n), (0, 0, 0, 0))
              ImageDraw.Draw(sh).ellipse((m, m + n * 0.03, n - m, n - m + n * 0.03), fill=(0, 0, 0, 120))
              sh = sh.filter(ImageFilter.GaussianBlur(n * 0.025))
              img = Image.alpha_composite(img, sh)
              d = ImageDraw.Draw(img)
              # body gradient (dark green -> bright green)
              body = Image.new("RGBA", (n, n), (0, 0, 0, 0))
              bd = ImageDraw.Draw(body)
              for i in range(n):
                  t = i / n
                  c = (int(30 + 80 * (1 - t)), int(110 + 90 * (1 - t)), int(10 + 20 * (1 - t)), 255)
                  bd.line((0, i, n, i), fill=c)
              mask = Image.new("L", (n, n), 0)
              ImageDraw.Draw(mask).ellipse((m, m, n - m, n - m), fill=255)
              img.paste(body, (0, 0), mask)
              d = ImageDraw.Draw(img)
              # rim
              d.ellipse((m, m, n - m, n - m), outline=(20, 70, 8, 255), width=max(2, n // 60))
              # disc
              cx = cy = n / 2
              r = n * 0.27
              d.ellipse((cx - r, cy - r, cx + r, cy + r), fill=(238, 243, 246, 255))
              r2 = r * 0.66
              d.ellipse((cx - r2, cy - r2, cx + r2, cy + r2), fill=(70, 150, 20, 255))
              r3 = r * 0.30
              d.ellipse((cx - r3, cy - r3, cx + r3, cy + r3), fill=(238, 243, 246, 255))
              r4 = r * 0.12
              d.ellipse((cx - r4, cy - r4, cx + r4, cy + r4), fill=(25, 40, 20, 255))
              # gloss on upper half
              gl = Image.new("RGBA", (n, n), (0, 0, 0, 0))
              gd = ImageDraw.Draw(gl)
              gd.ellipse((m + n * 0.05, m + n * 0.02, n - m - n * 0.05, n * 0.55), fill=(255, 255, 255, 70))
              gm = Image.new("L", (n, n), 0)
              ImageDraw.Draw(gm).ellipse((m, m, n - m, n - m), fill=255)
              gl.putalpha(Image.composite(gl.getchannel("A"), Image.new("L", (n, n), 0), gm))
              img = Image.alpha_composite(img, gl)
              return img.resize((size, size), Image.LANCZOS)


          for folder, size in [("ldpi", 36), ("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144)]:
              orb(size).save(f"{res}/drawable-{folder}/ic_launcher.png")

          # TV banner 320x180: dark background with the orb and a title
          W, H = 320 * 3, 180 * 3
          ban = Image.new("RGBA", (W, H), (12, 16, 18, 255))
          bd = ImageDraw.Draw(ban)
          for y in range(H):
              t = y / H
              bd.line((0, y, W, y), fill=(int(34 - 22 * t), int(42 - 28 * t), int(48 - 32 * t), 255))
          glow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          ImageDraw.Draw(glow).ellipse((-W * 0.2, H * 0.4, W * 0.7, H * 1.6), fill=(76, 163, 19, 110))
          glow = glow.filter(ImageFilter.GaussianBlur(40))
          ban = Image.alpha_composite(ban, glow)
          o = orb(int(H * 0.62))
          ban.alpha_composite(o, (int(W * 0.07), int((H - o.height) / 2)))
          bd = ImageDraw.Draw(ban)
          font = None
          for path in ("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                       "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf"):
              try:
                  font = ImageFont.truetype(path, int(H * 0.20))
                  small = ImageFont.truetype(path, int(H * 0.10))
                  break
              except OSError:
                  continue
          if font is None:
              font = small = ImageFont.load_default()
          tx = int(W * 0.07) + o.width + int(W * 0.05)
          bd.text((tx, int(H * 0.30)), "Flycast", font=font, fill=(255, 255, 255, 255))
          bd.text((tx, int(H * 0.56)), "DASHBOARD", font=small, fill=(150, 215, 80, 255))
          ban.convert("RGBA").resize((320, 180), Image.LANCZOS).save(f"{res}/drawable-xhdpi/ic_banner.png")
          print("done")
          DASH_EOF_ICONS
          python3 /tmp/make_icons.py "$PWD/shell/android-studio/flycast/src/main/res"

      - name: Use debug signing
        run: sed -i 's/signingConfigs.getByName("release")/signingConfigs.getByName("debug")/g' shell/android-studio/flycast/build.gradle.kts

      - name: Build
        working-directory: shell/android-studio
        run: ./gradlew assembleRelease --parallel

      - uses: actions/upload-artifact@v6
        with:
          name: flycast-dashboard-apk
          path: shell/android-studio/flycast/build/outputs/apk/release/*.apk
